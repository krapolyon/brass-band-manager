# The built front is served at /, the API at /api, as on the host.
<VirtualHost *:80>
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        AllowOverride All
        Require all granted
    </Directory>

    Alias /api /var/www/api/public

    <Directory /var/www/api/public>
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
